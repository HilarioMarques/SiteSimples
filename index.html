
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Sistema de Cadastro de Alunos</h1>
       
    </header>

    <main>
        <section class="formulario">
            <h2>Cadastrar Aluno</h2>

            <form>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Digite seu nome">

                <label for="email">E-mail:</label>
                <input type="email" id="email" placeholder="Digite seu e-mail">

                <label for="curso">Curso:</label>
                <input type="text" id="curso" placeholder="Digite seu curso">

                <button type="submit">Cadastrar</button>
            </form>
        </section>

        <section class="alunos">
            <h2>Alunos cadastrados</h2>

            <div class="aluno">
                <p><strong>Nome:</strong> João Silva</p>
                <p><strong>E-mail:</strong> joao@email.com</p>
                <p><strong>Curso:</strong> Ciência da Computação</p>
            </div>

            <div class="aluno">
                <p><strong>Nome:</strong> Maria Santos</p>
                <p><strong>E-mail:</strong> maria@email.com</p>
                <p><strong>Curso:</strong> Sistemas de Informação</p>
            </div>
        </section>
    </main>

</body>
</html>
